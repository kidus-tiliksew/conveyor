interface:
  display_name: "Conveyor Operator"
  short_description: "Operate durable Conveyor work orders"
  default_prompt: "Use $conveyor-operator to implement the approved Conveyor work order in its dedicated task worktree."

dependencies:
  tools:
    - type: "mcp"
      value: "conveyor-plugin"
      description: "Local Conveyor task-intake and work-order server"
      transport: "streamable_http"
      url: "http://127.0.0.1:8080/mcp"
