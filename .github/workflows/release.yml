name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-package-publish:
    name: Build, verify, and publish release
    runs-on: ubuntu-latest
    steps:
      # Pinned action commits keep a tagged release reproducible and auditable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build four release archives and checksums
        run: make release VERSION="$GITHUB_REF_NAME"
      - name: Verify linux amd64 release identity
        run: |
          set -eu
          mkdir verify
          tar -C verify -xzf "dist/conveyor_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
          test "$(verify/conveyor_${GITHUB_REF_NAME}_linux_amd64/conveyor --version)" = "conveyor version ${GITHUB_REF_NAME}"
          test "$(verify/conveyor_${GITHUB_REF_NAME}_linux_amd64/conveyord version)" = "conveyord ${GITHUB_REF_NAME}"
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish artifacts from this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes ;;
          esac
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: image-metadata
        with:
          images: ghcr.io/kidus-tiliksew/conveyor
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
