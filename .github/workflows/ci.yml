name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: 22

jobs:
  container-image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          build-args: VERSION=ci
          load: true
          push: false
          tags: conveyor:ci
      - run: make test-image IMAGE=conveyor:ci

  build-and-static:
    name: Build, vet, and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - run: make vet
      - run: make fmt-check

  plan:
    name: Plan CI shards
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.matrix.outputs.playwright }}
      postgres: ${{ steps.matrix.outputs.postgres }}
      singlestore: ${{ steps.matrix.outputs.singlestore }}
    steps:
      - uses: actions/checkout@v4
      # The Makefile defines every shard, so each one it names runs in its
      # own job and no shard can be left out of a matrix.
      - id: matrix
        run: make -s ci-shard-matrix | tee -a "$GITHUB_OUTPUT"

  go-test:
    name: Go tests and web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: make test-go
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps

  playwright:
    name: Playwright tests (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.playwright) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: make test-playwright-shard PLAYWRIGHT_SHARD=${{ matrix.shard }}
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps
          PLAYWRIGHT_REPORT_DIR: ${{ runner.temp }}/playwright-report
      - name: Upload the Playwright HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/playwright-report
          if-no-files-found: warn
          retention-days: 14

  postgres-integration:
    name: PostgreSQL integration tests (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.postgres) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conveyor
          POSTGRES_PASSWORD: conveyor
          POSTGRES_DB: conveyor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conveyor -d conveyor_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CONVEYOR_TEST_DATABASE_URL: postgres://conveyor:conveyor@127.0.0.1:5432/conveyor_test?sslmode=disable
      POSTGRES_INTEGRATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - name: Verify the CI integration target rejects a missing database URL
        run: |
          if env -u CONVEYOR_TEST_DATABASE_URL make test-integration-ci; then
            echo "test-integration-ci unexpectedly accepted an unset CONVEYOR_TEST_DATABASE_URL" >&2
            exit 1
          fi
      # The probe file belongs to internal/store/postgres, so it runs in the
      # shard that tests that package.
      - name: Verify a PostgreSQL-only regression fails the integration job
        if: matrix.shard == 'store'
        run: |
          set -o pipefail
          probe=internal/store/postgres/ci_regression_probe_test.go
          state="$RUNNER_TEMP/postgres-regression-fixture"
          log="$RUNNER_TEMP/postgres-regression.log"
          trap 'rm -f "$probe"' EXIT
          printf '%s\n' 'package postgres' 'import "testing"' 'func TestCIRegressionProbe(t *testing.T) { t.Fatal("deliberate PostgreSQL regression probe") }' > "$probe"
          if CONVEYOR_FIXTURE_STATE="$state" GOFLAGS='-run=TestCIRegressionProbe' make test-integration-ci POSTGRES_INTEGRATION_RUNTIME= 2>&1 | tee "$log"; then
            echo "test-integration-ci unexpectedly passed a failing PostgreSQL-only test" >&2
            exit 1
          fi
          grep -F 'deliberate PostgreSQL regression probe' "$log"
          grep -F '"outcome": "success", "phase": "prepare"' "$state/phases.jsonl"
          grep -F '"outcome": "failure", "phase": "gate"' "$state/phases.jsonl"
      - name: Verify a shard that selects no test fails the integration job
        run: |
          set -o pipefail
          state="$RUNNER_TEMP/postgres-no-tests-fixture"
          log="$RUNNER_TEMP/postgres-no-tests.log"
          if CONVEYOR_FIXTURE_STATE="$state" make test-integration-ci POSTGRES_INTEGRATION_RUNTIME= GO_INTEGRATION_FLAGS=-run=^TestNoSuchCIShardTest 2>&1 | tee "$log"; then
            echo "test-integration-ci unexpectedly passed a shard that selected no test" >&2
            exit 1
          fi
          grep -F 'go test selected no test in:' "$log"
          grep -F '"outcome": "success", "phase": "prepare"' "$state/phases.jsonl"
          grep -F '"outcome": "failure", "phase": "gate"' "$state/phases.jsonl"
      - run: make test-integration-ci
        env:
          CONVEYOR_FIXTURE_STATE: ${{ runner.temp }}/postgres-integration-fixture
      - name: Upload the PostgreSQL fixture phase logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-fixture-phases-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/postgres-regression-fixture/phases.jsonl
            ${{ runner.temp }}/postgres-no-tests-fixture/phases.jsonl
            ${{ runner.temp }}/postgres-integration-fixture/phases.jsonl
          if-no-files-found: warn
          retention-days: 14

  singlestore-integration:
    name: SingleStore integration tests (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.singlestore) }}
    services:
      singlestore:
        image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
        env:
          ROOT_PASSWORD: ${{ secrets.SINGLESTORE_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --cpus=4 --memory=4g
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    env:
      SINGLESTORE_INTEGRATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - name: Require test credentials
        env:
          SINGLESTORE_ROOT_PASSWORD: ${{ secrets.SINGLESTORE_ROOT_PASSWORD }}
        run: test -n "$SINGLESTORE_ROOT_PASSWORD" || { echo 'SINGLESTORE_ROOT_PASSWORD repository secret is required' >&2; exit 1; }
      - name: Verify missing URL fails the integration target
        run: |
          if env -u CONVEYOR_TEST_SINGLESTORE_URL make test-integration-singlestore-ci; then
            echo 'SingleStore target accepted an unset database URL' >&2
            exit 1
          fi
      # The probe opens the integration store in internal/store/singlestore.
      # The packages shard runs that package without its own -run pattern, so
      # the probe's GOFLAGS selection applies there.
      - name: Verify an integration regression fails the job
        if: matrix.shard == 'packages'
        env:
          CONVEYOR_TEST_SINGLESTORE_URL: root:${{ secrets.SINGLESTORE_ROOT_PASSWORD }}@tcp(127.0.0.1:3306)/conveyor_test
        run: |
          set -o pipefail
          probe=internal/store/singlestore/ci_regression_probe_test.go
          state="$RUNNER_TEMP/singlestore-regression-fixture"
          log="$RUNNER_TEMP/singlestore-regression.log"
          trap 'rm -f "$probe"' EXIT
          printf '%s\n' 'package singlestore' 'import "testing"' 'func TestCIRegressionProbe(t *testing.T) { integrationStore(t); t.Fatal("deliberate SingleStore regression") }' > "$probe"
          if CONVEYOR_FIXTURE_STATE="$state" GOFLAGS='-run=TestCIRegressionProbe' make test-integration-singlestore-ci SINGLESTORE_INTEGRATION_RUNTIME= 2>&1 | tee "$log"; then
            echo 'SingleStore target passed a deliberate regression' >&2
            exit 1
          fi
          grep -F 'deliberate SingleStore regression' "$log"
          grep -F '"outcome": "success", "phase": "prepare"' "$state/phases.jsonl"
          grep -F '"outcome": "failure", "phase": "gate"' "$state/phases.jsonl"
      - name: Verify a shard that selects no test fails the job
        env:
          CONVEYOR_TEST_SINGLESTORE_URL: root:${{ secrets.SINGLESTORE_ROOT_PASSWORD }}@tcp(127.0.0.1:3306)/conveyor_test
        run: |
          set -o pipefail
          state="$RUNNER_TEMP/singlestore-no-tests-fixture"
          log="$RUNNER_TEMP/singlestore-no-tests.log"
          if CONVEYOR_FIXTURE_STATE="$state" make test-integration-singlestore-ci SINGLESTORE_INTEGRATION_RUNTIME= GO_INTEGRATION_FLAGS=-run=^TestNoSuchCIShardTest 2>&1 | tee "$log"; then
            echo 'SingleStore target passed a shard that selected no test' >&2
            exit 1
          fi
          grep -F 'go test selected no test in:' "$log"
          grep -F '"outcome": "success", "phase": "prepare"' "$state/phases.jsonl"
          grep -F '"outcome": "failure", "phase": "gate"' "$state/phases.jsonl"
      - run: make test-integration-singlestore-ci
        env:
          CONVEYOR_TEST_SINGLESTORE_URL: root:${{ secrets.SINGLESTORE_ROOT_PASSWORD }}@tcp(127.0.0.1:3306)/conveyor_test
          CONVEYOR_FIXTURE_STATE: ${{ runner.temp }}/singlestore-integration-fixture
      - name: Upload the SingleStore fixture phase logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: singlestore-fixture-phases-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/singlestore-regression-fixture/phases.jsonl
            ${{ runner.temp }}/singlestore-no-tests-fixture/phases.jsonl
            ${{ runner.temp }}/singlestore-integration-fixture/phases.jsonl
          if-no-files-found: warn
          retention-days: 14
