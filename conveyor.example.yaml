# Conveyor deployment/bootstrap config (spec §21.4). CONVEYOR_API_KEY is the
# deployment-owned key used only by in-process triage/spec. MCP clients use
# their own agent subscriptions or API credentials on their own machines.
workspace: demo
pack_dir: pack
max_bounces: 2
work_order_queue_timeout: 24h
# cache_dir: ~/.conveyor/cache     # bare repo cache for checkout/diff flows

database:
  # backend: postgres
  # url: postgres://conveyor:conveyor@localhost:5432/conveyor?sslmode=disable

routing:
  stages:
    triage:
      model: gpt-5.6-luna
      timeout: 20m
      execution: in_process
    spec:
      model: gpt-5.6-luna
      timeout: 30m
      execution: in_process
    implement:
      model: operator-owned
      timeout: 4h
      execution: mcp
    review:
      model: operator-owned
      timeout: 1h
      execution: mcp

repos:
  - name: api
    url: https://github.com/your-org/your-repo
    github: your-org/your-repo
    base: main
