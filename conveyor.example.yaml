# Conveyor deployment/bootstrap config (spec §21.4). CONVEYOR_API_KEY is the
# deployment-owned key used only by in-process triage. MCP clients use
# their own agent subscriptions or API credentials on their own machines.
workspace: demo
pack_dir: pack
# Review rounds before human check-in (spec §21.17): the window resets after
# each human intervention; hitting it parks the task, it does not fail it.
max_bounces: 10
work_order_queue_timeout: 24h
# cache_dir: ~/.conveyor/cache     # bare repo cache for checkout/diff flows

database:
  # backend: postgres
  # url: postgres://conveyor:conveyor@localhost:5432/conveyor?sslmode=disable

# Default-setup projection for older clients (spec §21.27). The setup block
# below is authoritative; this and routing remain readable compatibility data.
execution_settings:
  control_plane:
    triage: {model: gpt-5.6-luna, timeout: 20m}
  spec:
    harness: local-agent
    model: gpt-5.6-sol
    model_policy: explicit
    effort: high
    timeout: 30m
  implementation:
    harness: local-agent
    model_policy: harness_default
    # Omit effort for the harness default; an explicit low, medium, or high
    # value is valid only when local-agent declares that effort_args mapping.
    effort: high
    timeout: 4h
  review:
    execution: mcp
    timeout: 1h

# Deprecated compatibility shape for older REST/CLI consumers.
routing:
  stages:
    triage:
      model: gpt-5.6-luna
      timeout: 20m
      execution: in_process
    spec:
      model: gpt-5.6-sol
      model_policy: explicit
      harness: local-agent
      effort: high
      timeout: 30m
      execution: mcp
    implement:
      model: operator-owned
      harness: local-agent
      effort: high
      timeout: 4h
      execution: mcp
    review:
      model: operator-owned
      harness: local-agent
      timeout: 1h
      execution: mcp

execution:
  spec_approval: true
  merge_approval: true
  implement_concurrency: 1
  review_concurrency: 1
  first_activity_timeout: 2m

# Argv arrays are executed directly, never through a shell. Replace
# agent-cli with the authenticated headless harness installed on the worker.
harnesses:
  - name: local-agent
    # JSON-file transport is for harnesses such as Claude Code or an operator
    # wrapper with a real --mcp-config file option (spec §21.20).
    mcp_transport: json_file
    command: [agent-cli, --prompt, "{prompt}", --mcp-config, "{mcp_config}"]
    model_args: [--model, "{model}"]
    # Provider-specific flags stay inside this shell-free adapter mapping.
    effort_args:
      high: [--effort, high]
    probe_command: [agent-cli, --version]
    probe_timeout: 10s

# One durable review order is created per ordered seat. A seat-level harness
# is optional and otherwise uses execution_settings.review.fallback_harness.
# Here every seat is explicit, so route-level fallback data is unused. Effort
# is optional; when absent, the selected harness keeps its own default.
review:
  seats:
    - model: gpt-5.6
      harness: local-agent
    - model: claude-opus-4.1
      harness: local-agent

# Named execution contracts are the authoritative v1.28 shape. The matching
# top-level execution_settings/review fields above are emitted as the default
# setup projection for older clients (spec §21.27 change 2).
default_setup: default
setups:
  - name: default
    refresh_review: delta # delta | full | none; frozen on each task
    execution_settings:
      control_plane:
        triage: {model: gpt-5.6-luna, timeout: 20m}
      spec:
        harness: local-agent
        model: gpt-5.6-sol
        model_policy: explicit
        effort: high
        timeout: 30m
      implementation:
        harness: local-agent
        model_policy: harness_default
        effort: high
        timeout: 4h
      review:
        execution: mcp
        timeout: 1h
    review:
      seats:
        - {model: gpt-5.6, harness: local-agent}
        - {model: claude-opus-4.1, harness: local-agent}

# Built-in Codex, Claude, and Grok harness starting points are maintained in
# internal/config/harness_templates.go and are available from the Workspace UI.
# Copy and customize a catalog entry here only when a deployment needs a
# checked-in harness configuration; workspaces are not seeded automatically.

repos:
  - name: api
    url: https://github.com/your-org/your-repo
    github: your-org/your-repo
    base: main

# The monitor is opt-in and limited to configured repositories. It uses the
# daemon's GitHub credential for read-only observation and always files normal
# gated tasks; it cannot claim, review, merge, or deploy them (spec §21.45).
monitor:
  enabled: false
  repositories: [api]
  poll_interval: 1m
  startup_window: 24h
