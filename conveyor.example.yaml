# Conveyor deployment/bootstrap config (spec §21.4). CONVEYOR_API_KEY is the
# deployment-owned key used only by in-process triage/spec. MCP clients use
# their own agent subscriptions or API credentials on their own machines.
workspace: demo
pack_dir: pack
# Review rounds before human check-in (spec §21.17): the window resets after
# each human intervention; hitting it parks the task, it does not fail it.
max_bounces: 10
work_order_queue_timeout: 24h
# cache_dir: ~/.conveyor/cache     # bare repo cache for checkout/diff flows

database:
  # backend: postgres
  # url: postgres://conveyor:conveyor@localhost:5432/conveyor?sslmode=disable

# Canonical contextual settings (spec §21.18). The legacy routing block below
# remains during the compatibility period but cannot override these values.
execution_settings:
  control_plane:
    triage: {model: gpt-5.6-luna, timeout: 20m}
    spec: {model: gpt-5.6-luna, timeout: 30m}
  implementation:
    harness: local-agent
    model_policy: harness_default
    # Omit effort for the harness default; an explicit low, medium, or high
    # value is valid only when local-agent declares that effort_args mapping.
    effort: high
    timeout: 4h
  review:
    execution: mcp
    timeout: 1h

# Deprecated compatibility shape for older REST/CLI consumers.
routing:
  stages:
    triage:
      model: gpt-5.6-luna
      timeout: 20m
      execution: in_process
    spec:
      model: gpt-5.6-luna
      timeout: 30m
      execution: in_process
    implement:
      model: operator-owned
      harness: local-agent
      effort: high
      timeout: 4h
      execution: mcp
    review:
      model: operator-owned
      harness: local-agent
      timeout: 1h
      execution: mcp

execution:
  default_mode: auto
  spec_approval: true
  merge_approval: true
  implement_concurrency: 1
  review_concurrency: 1

# Argv arrays are executed directly, never through a shell. Replace
# agent-cli with the authenticated headless harness installed on the worker.
harnesses:
  - name: local-agent
    command: [agent-cli, --prompt, "{prompt}", --mcp-config, "{mcp_config}"]
    model_args: [--model, "{model}"]
    # Provider-specific flags stay inside this shell-free adapter mapping.
    effort_args:
      high: [--effort, high]
    probe_command: [agent-cli, --version]
    probe_timeout: 10s

# One durable review order is created per ordered seat. A seat-level harness
# is optional and otherwise uses execution_settings.review.fallback_harness.
# Here every seat is explicit, so route-level fallback data is unused. Effort
# is optional; when absent, the selected harness keeps its own default.
review:
  seats:
    - model: gpt-5.6
      harness: local-agent
    - model: claude-opus-4.1
      harness: local-agent

# Adapter-level review effort excerpt (spec §21.19). Implementation effort uses
# the same harness mappings through execution_settings.implementation (spec
# §21.20). Merge these fields into the
# corresponding full harness entries after their authenticated wrapper defines
# the {mcp_config} transport; these are adapter argv, not complete launch
# commands:
# harnesses:
#   - name: codex
#     effort_args:
#       high: [--config, 'model_reasoning_effort="high"']
#   - name: claude
#     effort_args:
#       high: [--effort, high]
# review:
#   seats:
#     - {model: gpt-5.6-sol, harness: codex, effort: high}
#     - {model: claude-opus-4-8, harness: claude, effort: high}

repos:
  - name: api
    url: https://github.com/your-org/your-repo
    github: your-org/your-repo
    base: main
