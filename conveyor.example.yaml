# Conveyor deployment/bootstrap config (component-runtime). CONVEYOR_LLM_API_KEY is
# the deployment-owned key used only by in-process triage and planning. The old
# CONVEYOR_API_KEY name is a deprecated fallback. MCP clients use their own
# agent subscriptions or API credentials on their own machines.
# CONVEYOR_CONTROL_PLANE_MODEL overrides stored models for every in-process
# invocation. CONVEYOR_TRIAGE_MODEL and CONVEYOR_PLANNING_MODEL override the
# general value for their stages. Empty values are ignored; these deployment
# overrides never change the stored workspace configuration or MCP work orders.
#
# This file holds pipeline policy and the settings of the stages that run
# inside conveyord: triage, title generation, and planning (DEC-132). It holds
# no agent harness, model, or effort. The person who starts an agent session
# chooses its harness and model. The deployment loader still loads a file an
# earlier release wrote: it ignores and logs by name, never by value, any
# harnesses, setups, default_setup, routing, stage harness, model,
# model_policy, or effort, review fallbacks, and seat contents.
workspace: demo
# pack_dir: /path/to/custom/pack  # optional strict override; omitted uses the embedded canonical role pack
# Review rounds before human check-in (component-task-lifecycle): the window resets after
# each human intervention; hitting it parks the task, it does not fail it.
max_bounces: 10
work_order_queue_timeout: 24h
# planning_snapshot_max_bytes: 536870912  # cap compressed and extracted snapshot bytes

# Where conveyor checkout creates new task worktrees on an agent's machine
# (component-git-delivery). With no location, checkout creates no worktree.
# mode: repository places them at <primary checkout>/<dir> (dir defaults to
# _worktrees, added to .git/info/exclude); mode: machine places them under
# root (defaults to ~/.conveyor/worktrees). The daemon ignores it.
worktree_location:
  mode: machine
  root: ~/.conveyor/worktrees

database:
  # backend: postgres
  # url: postgres://conveyor:conveyor@localhost:5432/conveyor?sslmode=disable

# Set when several conveyord processes share one database (default false).
# runtime:
#   peers: true

# Settings of the in-process control-plane stages, and the stage timeouts
# that each task freezes at intake. Planning takes the triage model, effort,
# and timeout unless control_plane.planning states its own; planning_models
# lists alternate planning models.
execution_settings:
  control_plane:
    triage: {model: gpt-5.6-luna, timeout: 20m}
  spec:
    timeout: 30m
  implementation:
    timeout: 4h
  review:
    timeout: 1h

execution:
  default_plan_state: needed
  merge_approval: true
  implement_concurrency: 1
  review_concurrency: 1
  first_activity_timeout: 2m

# Review policy, frozen on each task at intake. The number of seats is the
# minimum review seat count; one review work order opens per seat. A seat holds
# no harness, model, or effort: each seat's agent session reports its own model
# when it claims the order.
review:
  # Off by default. When true, a review seat claim is refused when its
  # reported model name is blank or repeats a name another seat of the round
  # reports. Names are compared, never verified.
  distinct_models: false
  seats:
    - {}
    - {}

repos:
  - name: api
    url: https://github.com/your-org/your-repo
    github: your-org/your-repo
    base: main

# The monitor is opt-in and limited to configured repositories. It uses the
# daemon's GitHub credential for read-only observation and always files normal
# gated tasks; it cannot claim, review, merge, or deploy them (component-monitor-drift).
# merge_deferral_bound, when unset, is min(10m, startup_window - poll_interval - 5s)
# and is disabled when that value is not positive. An explicit bound must satisfy
# bound + poll_interval + 5s < startup_window so a deferred commit stays in the
# next poll's window.
monitor:
  enabled: false
  repositories: [api]
  poll_interval: 1m
  startup_window: 24h
  # merge_deferral_bound: 10m
