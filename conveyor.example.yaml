# Conveyor deployment/bootstrap config (spec §21.4). CONVEYOR_API_KEY is the
# deployment-owned key used only by in-process triage/spec. MCP clients use
# their own agent subscriptions or API credentials on their own machines.
workspace: demo
pack_dir: pack
# Review rounds before human check-in (spec §21.17): the window resets after
# each human intervention; hitting it parks the task, it does not fail it.
max_bounces: 10
work_order_queue_timeout: 24h
# cache_dir: ~/.conveyor/cache     # bare repo cache for checkout/diff flows

database:
  # backend: postgres
  # url: postgres://conveyor:conveyor@localhost:5432/conveyor?sslmode=disable

routing:
  stages:
    triage:
      model: gpt-5.6-luna
      timeout: 20m
      execution: in_process
    spec:
      model: gpt-5.6-luna
      timeout: 30m
      execution: in_process
    implement:
      model: operator-owned
      harness: codex
      timeout: 4h
      execution: mcp
    review:
      model: operator-owned
      harness: codex
      timeout: 1h
      execution: mcp

execution:
  default_mode: auto
  spec_approval: true
  merge_approval: true
  implement_concurrency: 1
  review_concurrency: 1

# Argv arrays are executed directly, never through a shell. Replace
# agent-cli with the authenticated headless harness installed on the worker.
harnesses:
  - name: codex
    command: [codex, exec, "{prompt}", --config, "{mcp_config}"]
    model_args: [--model, "{model}"]
    effort_args:
      high: [--config, 'model_reasoning_effort="high"']
    probe_command: [codex, --version]
    probe_timeout: 10s
  - name: claude
    command: [claude, -p, "{prompt}", --mcp-config, "{mcp_config}"]
    model_args: [--model, "{model}"]
    effort_args:
      high: [--effort, high]
    probe_command: [claude, --version]
    probe_timeout: 10s

# One durable review order is created per ordered seat. A seat-level harness
# is optional and otherwise inherits routing.stages.review.harness. Effort is
# optional; when absent, the selected harness keeps its own default.
review:
  seats:
    - model: gpt-5.6-sol
      harness: codex
      effort: high
    - model: claude-opus-4-8
      harness: claude
      effort: high

repos:
  - name: api
    url: https://github.com/your-org/your-repo
    github: your-org/your-repo
    base: main
