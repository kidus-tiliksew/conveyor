name: conveyor

services:
  postgres:
    image: postgres:16-alpine
    container_name: conveyor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: conveyor
      POSTGRES_DB: conveyor
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor -d conveyor"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: ${CONVEYOR_POSTGRES_VOLUME:-conveyor-postgres-data}
